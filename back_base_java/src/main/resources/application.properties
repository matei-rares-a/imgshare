# ============================================================
# Storage backend: s3 (default) | local
# ============================================================
storage.backend=local

# Local filesystem (active when storage.backend=local)
photo.storage.dir=photos

# AWS S3
aws.s3.bucket=imgshareapp-bucket-10002
aws.s3.region=eu-central-1

# Presigned URL TTLs
aws.s3.presigned-url.upload-ttl-minutes=15
aws.s3.presigned-url.download-ttl-minutes=60

# ============================================================
# Database (PostgreSQL) — required when storage.backend=s3
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/imgshare
spring.datasource.username=imgshare
spring.datasource.password=imgshare
spring.datasource.driver-class-name=org.postgresql.Driver

# Let Flyway own DDL; Hibernate validates only
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# Skip datasource/JPA/Redis auto-config entirely when running with storage.backend=local
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# ============================================================
# Redis — required when storage.backend=s3
# ============================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# ============================================================
# Cache TTLs
# ============================================================
# Gallery list pages (mutable — short TTL)
cache.gallery-list.ttl-seconds=60
# Individual image metadata (immutable after upload — long TTL)
cache.image-meta.ttl-seconds=3600

# ============================================================
# Server
# ============================================================
server.address=0.0.0.0
server.port=5001

# ============================================================
# Upload limits
# ============================================================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ============================================================
# Pagination
# ============================================================
gallery.initial-load=30
gallery.page-load=20

# ============================================================
# Idempotency key TTL
# ============================================================
idempotency.ttl-hours=24

# ============================================================
# Hard delete job
# ============================================================
# How often to run (ms) — default 5 min
hard-delete.interval-ms=300000
# Records deleted more than this many minutes ago are eligible for hard delete
hard-delete.retention-minutes=30